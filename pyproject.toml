[project]
name = "promptune"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinícius de Paula Moraes", email = "viniciusmoraes295651@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.54",
]

[project.scripts]
promptune = "promptune:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]

[tool.fastapi]
entrypoint = "promptune.main:app"
